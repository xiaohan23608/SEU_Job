<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>东南大学计软智学院招聘信息</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-content">
            <a href="#/" class="navbar-brand">东南大学计软智学院招聘信息</a>
        </div>
    </nav>

    <!-- 主页：卡片列表 -->
    <div id="page-home" class="page">
        <div class="container">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="搜索招聘信息...">
                <button id="searchBtn" class="btn btn-primary">搜索</button>
            </div>
            <div id="cardGrid" class="card-grid">
                <!-- 卡片通过 JS 动态生成 -->
            </div>
            <div id="pagination" class="pagination"></div>
        </div>
    </div>

    <!-- 详情页 -->
    <div id="page-detail" class="page" style="display:none;">
        <div class="detail-container">
            <div class="detail-header">
                <a href="#/" class="btn-back">← 返回列表</a>
            </div>
            <div class="detail-card" id="detailContent">
                <!-- 详情通过 JS 动态生成 -->
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
